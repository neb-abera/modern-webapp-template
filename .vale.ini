# Prose rules for everything a reader sees: Markdown here, and the prerendered
# HTML of a site that has one. scripts/check-prose.sh runs Vale with this file.
# The rules are .vale/styles/Abera, one file each. The writing standard they
# enforce is the Writing section of the global CLAUDE.md.
StylesPath = .vale/styles
MinAlertLevel = error

[*.{md,html}]
BasedOnStyles = Abera
