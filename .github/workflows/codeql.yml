name: CodeQL

on:
  # Unfiltered pull_request: a PR stacked on a feature branch still gets
  # scanned (see ci.yml).
  pull_request:
  # Required checks must also run on queued merge groups if a merge queue is
  # ever enabled (see ci.yml). Harmless while no queue exists.
  merge_group:
  push:
    branches: [main, master]
  schedule:
    # Weekly scan so new queries run even without commits
    - cron: "30 6 * * 1"

# Outside a pull request each commit gets its own group. A group holds one
# running and one pending run, and a third run cancels the pending one
# whatever cancel-in-progress says. Keyed by branch, that left aberaTech
# 2d7cced and aab70ed with no checks on 2026-09-26. On a pull request a
# newer push still cancels the older run. scripts/check-concurrency.sh
# enforces this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, actions]

    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; don't persist the token.
          persist-credentials: false

      - name: initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
