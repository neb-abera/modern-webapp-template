name: Release

on:
  push:
    tags:
      - "v*"

# One release at a time, never cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege: this workflow verifies, publishes the container image to
# GHCR and creates the GitHub Release.
permissions:
  contents: read

jobs:  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: run the verification suite
        run: ./scripts/verify.sh

  release:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
# Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # github.ref_name is passed through env rather than interpolated into
      # the script: tag names may contain shell metacharacters.
      - name: build and push image
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$image:$TAG" -t "$image:latest" .
          docker push "$image:$TAG"
          docker push "$image:latest"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$TAG" | cut -d@ -f2)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        id: push

      # SLSA build provenance: consumers can verify the image was built by
      # this workflow from this commit (gh attestation verify).
      - name: attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # SBOM for the released image, generated from what was actually
      # pushed (not the source tree) and attached to the GitHub Release so
      # consumers can audit what the image contains without pulling it.
      - name: generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Release $TAG" \
            --generate-notes \
            --notes "Container image: \`$image:$TAG\`" \
            sbom.spdx.json
