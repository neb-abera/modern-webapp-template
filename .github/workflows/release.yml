name: Release

on:
  push:
    tags:
      - "v*"

# One release at a time, never cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege: this workflow verifies, publishes the container image to
# GHCR and creates the GitHub Release.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: run the verification suite
        run: ./scripts/verify.sh

  release:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # github.ref_name is passed through env rather than interpolated into
      # the script: tag names may contain shell metacharacters.
      - name: build and push image
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$image:$TAG" -t "$image:latest" .
          docker push "$image:$TAG"
          docker push "$image:latest"

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Release $TAG" \
            --generate-notes \
            --notes "Container image: \`$image:$TAG\`"
