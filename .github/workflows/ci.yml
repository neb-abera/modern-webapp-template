name: CI

on:
  # Every pull request, whatever it targets. Filtering on the default branch
  # means a PR stacked on another feature branch gets no checks at all — the
  # change most likely to go wrong is the one nothing verifies.
  pull_request:
  # If a merge queue is ever enabled it replaces the strict up-to-date rule,
  # and required checks must run on the queued merge group or every merge
  # waits forever (or proceeds ungated). Harmless while no queue exists.
  merge_group:
  push:
    branches: [main, master]

# A newer push to a pull request makes the running check obsolete. A newer
# push to the default branch does not: cancelling it left a merge commit
# with no checks and no scan (aberaTech #169, 2026-09-18).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token: read-only for all CI jobs.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # The full suite (build, tests, image, e2e) normally finishes well inside
    # this; a hung container should not hold the runner for six hours.
    timeout-minutes: 30
    # The Codecov upload below is optional (dashboard only) and must not
    # fail the gate when the token is absent — a fresh repository generated
    # from this template has no CODECOV_TOKEN secret. A secret cannot be
    # used in `if:` directly, so it is routed through job-level env.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; don't leave the token on disk for every
          # later step and child process to read.
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # CI runs exactly what `make verify` runs locally: the same containers,
      # the same checks, the same tally. The GHA layer cache only changes how
      # fast the production image builds, not what is built.
      - name: run the verification suite
        env:
          VERIFY_DOCKER_BUILD_ARGS: --load --cache-from type=gha --cache-to type=gha,mode=max
        run: ./scripts/verify.sh

      # Dashboard-only: the blocking coverage floors are enforced in-job by
      # verify.sh (server, 85% lines) and vitest's coverage thresholds
      # (client, 90% lines), so this works with or without a Codecov
      # account. verify.sh exports both reports to coverage-artifacts/
      # whenever GITHUB_STEP_SUMMARY is set, as it is here.
      - name: upload coverage to Codecov (dashboard only, needs CODECOV_TOKEN)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-artifacts/server-cobertura.xml,coverage-artifacts/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      # The four delivery/UI bugs that reach production are the ones nothing
      # opened in a browser; when the browser suite fails, the trace is how
      # you see what it saw.
      - name: playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: e2e-test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Flags known-vulnerable or unwanted-license dependencies introduced by a
  # PR, from the diff of the dependency graph.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Only what this job actually dials: checkout (github.com) and the
          # dependency-review API calls. No package registries — the job reads
          # the dependency graph diff, it never restores a package.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Copyleft licenses a new dependency must not bring into this
          # Apache-2.0 project. SPDX identifiers, comma-separated; the
          # -only and -or-later variants are distinct identifiers, so both
          # are listed.
          deny-licenses: >-
            AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later

  # Lint the linters: the workflows and shell scripts every other gate is
  # built out of get no checks from the app toolchain, so a typo'd `if:`
  # or an unquoted variable in verify.sh fails silently until it matters.
  # The commit-msg hook and the Claude PreToolUse gate both run on the machine
  # making the commit, so a commit made anywhere they are not installed reaches
  # a pull request untouched. On 2026-09-24 a branch cut from a pre-rewrite
  # master was merged and put 45 stripped attribution lines back on the default
  # branch. This runs where the merge happens.
  #
  # fetch-depth: 0 because the check reads every commit the pull request would
  # add, and a shallow clone has no merge base to measure that from.
  attribution:
    name: attribution (no AI credit in commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: prove the check can fail
        run: ./scripts/check-attribution.sh --self-test

      - name: no commit in this pull request credits an AI
        run: ./scripts/check-attribution.sh "origin/${GITHUB_BASE_REF}..HEAD"

  # actionlint validates the workflow files (delegating embedded run: blocks
  # to shellcheck); shellcheck covers scripts/*.sh and scripts/db/*.sh. Both
  # come from the digest-pinned image in the Dockerfile's `actionlint` stage,
  # the one place their version is written, and `make lint` runs them there.
  lint:
    name: lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # checkout dials github.com. The Docker daemon pulls the lint image
          # from Docker Hub on the host resolver, and the container itself
          # makes no network call.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (workflows, including embedded shell) and shellcheck (scripts)
        run: make lint

      # The monthly upgrade tool (dotnet-major-upgrade.yml) runs unattended,
      # so this is the only run anyone watches: its self-test upgrades a
      # planted stale major in a temp copy of the tree with curl and docker
      # stubbed, and a regex that rotted is a red pull request here rather
      # than a wrong upgrade PR in November. No network: harden-runner's
      # block policy above stays as it is.
      - name: check-dotnet-major.sh self-test (the upgrade tool proves it does the job)
        run: ./scripts/check-dotnet-major.sh --self-test

  # setup.sh runs once per generated repository, where nobody watches it.
  # This renames a copy of the tree the way setup.sh does, fails on any file
  # still naming the template, checks the settings it would send against a
  # stubbed gh, then builds the copy and runs its server, client and
  # end-to-end tests.
  generate:
    name: generate (renamed copy builds and passes its tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds and runs containers, and
          # container-side DNS bypasses harden-runner's resolver.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: rename a copy, then build and test it
        env:
          VERIFY_DOCKER_BUILD_ARGS: --load --cache-from type=gha
        run: make generate
