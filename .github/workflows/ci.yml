name: CI

on:
  # Every pull request, whatever it targets. Filtering on the default branch
  # means a PR stacked on another feature branch gets no checks at all — the
  # change most likely to go wrong is the one nothing verifies.
  pull_request:
  # If a merge queue is ever enabled it replaces the strict up-to-date rule,
  # and required checks must run on the queued merge group or every merge
  # waits forever (or proceeds ungated). Harmless while no queue exists.
  merge_group:
  push:
    branches: [main, master]

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: read-only for all CI jobs.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # The full suite (build, tests, image, e2e) normally finishes well inside
    # this; a hung container should not hold the runner for six hours.
    timeout-minutes: 30
    # The Codecov upload below is optional (dashboard only) and must not
    # fail the gate when the token is absent — a fresh repository generated
    # from this template has no CODECOV_TOKEN secret. A secret cannot be
    # used in `if:` directly, so it is routed through job-level env.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; don't leave the token on disk for every
          # later step and child process to read.
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # CI runs exactly what `make verify` runs locally: the same containers,
      # the same checks, the same tally. The GHA layer cache only changes how
      # fast the production image builds, not what is built.
      - name: run the verification suite
        env:
          VERIFY_DOCKER_BUILD_ARGS: --load --cache-from type=gha --cache-to type=gha,mode=max
        run: ./scripts/verify.sh

      # Dashboard-only: the blocking coverage floors are enforced in-job by
      # verify.sh (server, 85% lines) and vitest's coverage thresholds
      # (client, 90% lines), so this works with or without a Codecov
      # account. verify.sh exports both reports to coverage-artifacts/
      # whenever GITHUB_STEP_SUMMARY is set, as it is here.
      - name: upload coverage to Codecov (dashboard only, needs CODECOV_TOKEN)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-artifacts/server-cobertura.xml,coverage-artifacts/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      # The four delivery/UI bugs that reach production are the ones nothing
      # opened in a browser; when the browser suite fails, the trace is how
      # you see what it saw.
      - name: playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: e2e-test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Flags known-vulnerable or unwanted-license dependencies introduced by a
  # PR, from the diff of the dependency graph.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # Only what this job actually dials: checkout (github.com) and the
          # dependency-review API calls. No package registries — the job reads
          # the dependency graph diff, it never restores a package.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Copyleft licenses a new dependency must not bring into this
          # Apache-2.0 project. SPDX identifiers, comma-separated; the
          # -only and -or-later variants are distinct identifiers, so both
          # are listed.
          deny-licenses: >-
            AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later

  # Lint the linters: the workflows and shell scripts every other gate is
  # built out of get no checks from the app toolchain, so a typo'd `if:`
  # or an unquoted variable in verify.sh fails silently until it matters.
  # actionlint validates the workflow files (delegating embedded run: blocks
  # to shellcheck); shellcheck covers scripts/*.sh. Both binaries are
  # version- and checksum-pinned so this job runs exactly what was reviewed.
  lint:
    name: lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout dials github.com; the two release tarballs redirect to
          # the githubusercontent asset hosts.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install pinned actionlint and shellcheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          curl -fsSLo shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: actionlint (workflows, including embedded shell)
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck "$RUNNER_TEMP/shellcheck"'

      - name: shellcheck (scripts/*.sh)
        run: '"$RUNNER_TEMP/shellcheck" scripts/*.sh'
