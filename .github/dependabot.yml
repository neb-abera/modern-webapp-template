# Keeps the SHA-pinned GitHub Actions, base images and package ecosystems
# current. Dependabot PRs update the pinned SHA and the version comment
# together, so supply-chain pinning and staying on the latest versions are
# compatible.
#
# Minor and patch updates are grouped into one PR per ecosystem so the
# default open-PR limit (5 per entry) never queues updates behind unmerged
# noise. Majors arrive as individual PRs; the dependabot-automerge workflow
# arms every PR, so a major merges itself when CI is green and stays open —
# red — when it genuinely conflicts. Open red PRs are the human queue.
#
# Every ecosystem waits out a 5-day cooldown before taking a new release:
# most supply-chain attacks on registries are caught and yanked within days,
# so auto-merging a release published hours ago is the riskiest moment to
# take it. Security updates ignore the cooldown and arrive immediately.
#
# Packages that must move together are grouped at every update level, majors
# included, or a major arrives as two PRs that each fail to install.
#
# Not covered by Dependabot: <TargetFramework> in server/Directory.Build.props
# and the cross-major jumps it gates — the dotnet-major-upgrade workflow
# (scripts/check-dotnet-major.sh) covers those.
#
# LTS majors only. .NET LTS majors are even and ship every other November.
# A Node major turns LTS in the October after its release. The ignore
# ranges below hold back each major that is not LTS, one range per major.
# Dependabot reads them in Bundler syntax against the version, so digest,
# minor and patch updates of the current major still arrive.
# scripts/check-lts-majors.sh fails when a range is missing for a major due
# within two years, when a Node major has turned LTS and its range is still
# here, and when @types/node and the node image drift apart.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "dotnet/*"
        versions:
          - ">= 11, < 12"
          - ">= 13, < 14"
          - ">= 15, < 16"
      - dependency-name: node
        versions:
          # 25 never turns LTS. 26 turns LTS on 2026-10-28, and
          # scripts/check-lts-majors.sh fails from then until this range
          # comes out.
          - ">= 25, < 26"
          - ">= 26, < 27"
          - ">= 27, < 28"
          - ">= 28, < 29"
          - ">= 29, < 30"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Covers image tags in compose.yaml (e.g. the postgres service behind the
  # `db` profile, whose digest scripts/db/check-runtime-role.sh also reads).
  # The docker ecosystem above only scans Dockerfiles.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    # The framework packages carry the runtime's major.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        versions:
          - ">= 11, < 12"
          - ">= 13, < 14"
          - ">= 15, < 16"
      - dependency-name: "Microsoft.Extensions.*"
        versions:
          - ">= 11, < 12"
          - ">= 13, < 14"
          - ">= 15, < 16"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    # The node image's ranges: the types follow the runtime.
    ignore:
      - dependency-name: "@types/node"
        versions:
          # 25 never turns LTS. 26 turns LTS on 2026-10-28, and
          # scripts/check-lts-majors.sh fails from then until this range
          # comes out.
          - ">= 25, < 26"
          - ">= 26, < 27"
          - ">= 27, < 28"
          - ">= 28, < 29"
          - ">= 29, < 30"
    groups:
      # vitest and @vitest/* peer-depend on each other's exact version, so a
      # major split across two PRs cannot install in either (vitest 5, 2026-09:
      # #45 and #46 each failed npm ci and sat red). First match wins, so this
      # catches the pair before the minor-patch group does.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      npm-minor-patch:
        update-types: [minor, patch]

  # The client type generator's own manifest (tools/api-types/package.json
  # says why it has one). Before it existed openapi-typescript sat in the
  # client manifest held at 6, because 7 peer-depends on typescript ^5.x and
  # the client compiles with TypeScript 7: no bump could ever install, so none
  # was offered and the pin aged in silence.
  - package-ecosystem: npm
    directory: /tools/api-types
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      # The generator drives the TypeScript JavaScript compiler API and
      # declares peer typescript ^5.x. A TypeScript major here cannot install
      # until openapi-typescript widens that range, and its own major is what
      # would do it - that PR arrives unignored. Drop this entry then.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      api-types-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
