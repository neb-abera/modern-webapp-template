# Keeps the SHA-pinned GitHub Actions, base images and package ecosystems
# current. Dependabot PRs update the pinned SHA and the version comment
# together, so supply-chain pinning and staying on the latest versions are
# compatible.
#
# Minor and patch updates are grouped into one PR per ecosystem so the
# default open-PR limit (5 per entry) never queues updates behind unmerged
# noise. Majors arrive as individual PRs; the dependabot-automerge workflow
# arms every PR, so a major merges itself when CI is green and stays open —
# red — when it genuinely conflicts. Open red PRs are the human queue.
#
# Every ecosystem waits out a 5-day cooldown before taking a new release:
# most supply-chain attacks on registries are caught and yanked within days,
# so auto-merging a release published hours ago is the riskiest moment to
# take it. Security updates ignore the cooldown and arrive immediately.
#
# Not covered by Dependabot: <TargetFramework> in server/Directory.Build.props
# and the cross-major jumps it gates — the dotnet-major-upgrade workflow
# (scripts/check-dotnet-major.sh) covers those.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Covers image tags in compose.yaml (e.g. the optional postgres service,
  # once uncommented). The docker ecosystem above only scans Dockerfiles.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
