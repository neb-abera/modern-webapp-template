# Codecov is dashboard-only for this template: the BLOCKING coverage floors
# live in the verify suite itself — scripts/verify.sh gates server line
# coverage at 85%, and client/vite.config.ts's coverage.thresholds gate the
# client at 90% lines / 85% branches — so the gate works with or without a
# Codecov account. Uploads happen in the CI verify job only when a
# CODECOV_TOKEN secret exists, and never fail the build.
ignore:
  # Test and load-harness code measuring itself would only inflate the
  # number.
  - "client/tests"
  - "server/Api.Tests"
  - "e2e"
  - "load"
  # The browser bootstrap (createRoot/hydrateRoot) only runs in a real
  # browser; the e2e suite covers it end to end. It is excluded from the
  # vitest coverage run for the same reason (see client/vite.config.ts).
  - "client/src/main.tsx"

comment:
  require_changes: true

# Informational only: these statuses annotate the dashboard and PRs without
# ever going red — the enforced floors above are in-job.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 80%
        informational: true
