# No `name:` on purpose. Compose falls back to the directory, and a worktree or
# a second clone already has a directory of its own, so two copies of this
# repository never share container names or volumes. Published ports cannot be
# derived that way — compose only reads numbers — so scripts/worktree-env.sh
# writes them to .env, which compose loads on every invocation.
services:
  # Production-like: the runtime image serving API + built client together.
  # Health comes from the image's HEALTHCHECK (see the Dockerfile): the
  # chiseled runtime has no shell, so a compose-level `test:` command could
  # not run inside it — the image's dotnet self-probe is the one mechanism
  # that works, and compose inherits it for service_healthy / --wait.
  app:
    build:
      context: .
      target: runtime
    ports:
      - "${APP_PORT:-8080}:8080"
    # The deliberate values live in server/Api/appsettings.json; any of them
    # can be overridden here the way production overrides them, as environment
    # variables (docs/deploying.md lists them). One has no usable default: this
    # is the production image, which refuses to start without the host names it
    # answers to (any other Host is a 400; /healthz is exempt). On the compose
    # network it is reached as `app` (k6) and `app-under-test` (e2e) as well as
    # localhost (`make run`).
    environment:
      HostAllowlist__Hosts: ${ALLOWED_HOSTS:-localhost,app,app-under-test}
    # SIGTERM -> SIGKILL window on stop and redeploy. This is Docker's
    # default, written down because the app depends on it: the server's
    # shutdown timeout is 8s (HostOptions in Program.cs, pinned by a test)
    # so in-flight requests drain and the process exits before the kill.
    # If you raise one, keep the other inside it.
    stop_grace_period: 10s
    # Chromium hard-upgrades any host named `app` to HTTPS (the entire .app
    # TLD is HSTS-preloaded, and the bare name matches), which breaks
    # browser-driven tests against http://app:8080 with ERR_SSL_PROTOCOL_ERROR.
    # `make e2e` targets this alias instead; non-browser clients (k6) can
    # keep using the service name.
    networks:
      default:
        aliases:
          - app-under-test

  # Development profile (`docker compose --profile dev up`): hot-reloading
  # server and client in separate containers.
  server:
    profiles: [dev]
    build:
      context: .
      target: dev
    # As the user who owns the checkout: the image's own user can neither read
    # nor write a tree left at rw-rw---- by a umask of 007 (Makefile says more).
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    command: dotnet watch --project Api --non-interactive
    working_dir: /work/server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./server:/work/server
    ports:
      - "${APP_PORT:-8080}:8080"

  client:
    profiles: [dev]
    build:
      context: .
      target: dev
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    command: sh -c "npm install && npm run dev"
    working_dir: /work/client
    environment:
      VITE_API_PROXY: http://server:8080
    volumes:
      - ./client:/work/client
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    depends_on:
      - server

  # One-shot (`make contract`): regenerate server/Api/openapi.json and
  # client/src/api-types.d.ts into the checkout. The generator's node_modules
  # stays the image's.
  contract:
    profiles: [tools]
    build:
      context: .
      target: contract
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      HOME: /tmp
      DOTNET_CLI_HOME: /tmp
      NUGET_PACKAGES: /tmp/nuget
    volumes:
      - .:/work
      - /work/tools/api-types/node_modules

  # Load-test harness (`make load`): k6 drives the production-like app.
  # A harness rather than a CI gate - shared runners make load numbers
  # noise; run it on quiet hardware when you want real answers.
  k6:
    profiles: [load]
    image: grafana/k6:2.2.0
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE_URL: http://app:8080
    command: run /scripts/smoke.js
    # Wait for the app to be healthy, not merely started: k6 hitting a
    # container that hasn't bound its port yet reports connection errors
    # as if they were findings.
    depends_on:
      app:
        condition: service_healthy

  # The database, off until asked for (`docker compose --profile db up -d db`).
  # A real service under a profile rather than a commented-out block: the image
  # is pinned by digest and kept current by Dependabot, and
  # scripts/db/check-runtime-role.sh (part of `make verify`) reads THIS line to
  # choose the PostgreSQL it proves the runtime role's grants against.
  # docs/manual-setup.md, "The day you add a database", has the rest.
  db:
    profiles: [db]
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
