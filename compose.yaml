# No `name:` on purpose. Compose falls back to the directory, and a worktree or
# a second clone already has a directory of its own, so two copies of this
# repository never share container names or volumes. Published ports cannot be
# derived that way — compose only reads numbers — so scripts/worktree-env.sh
# writes them to .env, which compose loads on every invocation.
services:
  # Production-like: the runtime image serving API + built client together.
  # Health comes from the image's HEALTHCHECK (see the Dockerfile): the
  # chiseled runtime has no shell, so a compose-level `test:` command could
  # not run inside it — the image's dotnet self-probe is the one mechanism
  # that works, and compose inherits it for service_healthy / --wait.
  app:
    build:
      context: .
      target: runtime
    ports:
      - "${APP_PORT:-8080}:8080"
    # SIGTERM -> SIGKILL window on stop and redeploy. This is Docker's
    # default, written down because the app depends on it: the server's
    # shutdown timeout is 8s (HostOptions in Program.cs, pinned by a test)
    # so in-flight requests drain and the process exits before the kill.
    # If you raise one, keep the other inside it.
    stop_grace_period: 10s
    # Chromium hard-upgrades any host named `app` to HTTPS (the entire .app
    # TLD is HSTS-preloaded, and the bare name matches), which breaks
    # browser-driven tests against http://app:8080 with ERR_SSL_PROTOCOL_ERROR.
    # `make e2e` targets this alias instead; non-browser clients (k6) can
    # keep using the service name.
    networks:
      default:
        aliases:
          - app-under-test

  # Development profile (`docker compose --profile dev up`): hot-reloading
  # server and client in separate containers.
  server:
    profiles: [dev]
    build:
      context: .
      target: dev
    command: dotnet watch --project Api --non-interactive
    working_dir: /work/server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./server:/work/server
    ports:
      - "${APP_PORT:-8080}:8080"

  client:
    profiles: [dev]
    build:
      context: .
      target: dev
    command: sh -c "npm install && npm run dev"
    working_dir: /work/client
    environment:
      VITE_API_PROXY: http://server:8080
    volumes:
      - ./client:/work/client
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    depends_on:
      - server

  # Load-test harness (`make load`): k6 drives the production-like app.
  # A harness rather than a CI gate - shared runners make load numbers
  # noise; run it on quiet hardware when you want real answers.
  k6:
    profiles: [load]
    image: grafana/k6:2.2.0
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE_URL: http://app:8080
    command: run /scripts/smoke.js
    # Wait for the app to be healthy, not merely started: k6 hitting a
    # container that hasn't bound its port yet reports connection errors
    # as if they were findings.
    depends_on:
      app:
        condition: service_healthy

  # Need a database? Uncomment and add a connection string to the server.
  # db:
  #   image: postgres:18-alpine
  #   environment:
  #     POSTGRES_PASSWORD: dev-only-password
  #   ports:
  #     - "${DB_PORT:-5432}:5432"
